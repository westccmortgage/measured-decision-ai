name: Deploy Supabase AI Worker

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-supabase-function.yml"
      - "supabase/config.toml"
      - "supabase/functions/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy spatial analysis worker
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: >-
          supabase functions deploy spatial-analyze
          --project-ref hbqlhplgqwuesrovbiye
