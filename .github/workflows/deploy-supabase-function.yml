name: Deploy Supabase Production

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-supabase-function.yml"
      - "supabase/config.toml"
      - "supabase/functions/**"
      - "supabase/migrations/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-database:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link production project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: >-
          supabase link
          --project-ref hbqlhplgqwuesrovbiye

      - name: Apply pending database migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          # Migrations 001-004 were applied through the Dashboard before this
          # repository adopted Supabase migration tracking. Record that known
          # production state, then apply only migrations that are actually new.
          supabase migration repair --linked --status applied 001 002 003 004
          supabase db push --linked

  deploy-functions:
    needs: deploy-database
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy plan analysis worker
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: >-
          supabase functions deploy plan-analyze
          --project-ref hbqlhplgqwuesrovbiye

      - name: Deploy spatial analysis worker
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: >-
          supabase functions deploy spatial-analyze
          --project-ref hbqlhplgqwuesrovbiye
