name: Connect analysis to the existing Measured Decision project
on:
  push:
    branches: [claude/core-v2-production-runner-v1]
    paths: [.github/workflows/connect-existing-analysis.yml]
permissions:
  contents: read
concurrency:
  group: connect-existing-analysis
  cancel-in-progress: false
jobs:
  connect:
    if: github.repository == 'westccmortgage/measured-decision-ai' && github.ref == 'refs/heads/claude/core-v2-production-runner-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify the changed page and real function imports
        run: |
          node --check studio/analysis/app.js
          node studio/tests/which-database.mjs
          npm exec --yes --package=typescript@6.0.2 -- bash workers/core-v2-runner/tests/typecheck-doors.sh
          python -m py_compile .github/scripts/connect-existing-analysis.py
      - name: Prepare the existing database and login redirects
        run: python .github/scripts/connect-existing-analysis.py prepare
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy only the three analysis functions to the existing project
        run: |
          for function_name in core-v2-analysis core-v2-runner core-v2-runner-tick; do
            supabase functions deploy "$function_name" --project-ref hbqlhplgqwuesrovbiye
          done
      - name: Verify the deployed runner and enable owner-started analyses
        run: python .github/scripts/connect-existing-analysis.py activate
