name: Enable real AI for owner-started staging analyses

# Configuration only. No function invocation, fixture, migration or paid test.
on:
  push:
    branches: [claude/core-v2-production-runner-v1]
    paths: [.github/workflows/enable-analysis-staging.yml]

permissions:
  contents: read

concurrency:
  group: enable-analysis-staging
  cancel-in-progress: false

jobs:
  enable-staging:
    if: github.repository == 'westccmortgage/measured-decision-ai' && github.ref == 'refs/heads/claude/core-v2-production-runner-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check staging readiness and enable its existing network gate
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: python
        run: |
          import hashlib
          import json
          import os
          import urllib.error
          import urllib.request

          # Deliberately not an input: this job cannot target production.
          project = "viuqggxrahckzbrnecoo"
          root = "https://api.supabase.com/v1/projects/" + project
          flag = "CORE_V2_RUNNER_ALLOW_PROVIDER_NETWORK"
          token = os.environ.get("SUPABASE_ACCESS_TOKEN", "")
          if not token:
              raise SystemExit("The existing deployment credential is unavailable; nothing changed.")

          def api(path, payload=None):
              request = urllib.request.Request(
                  root + path,
                  data=None if payload is None else json.dumps(payload).encode(),
                  headers={"Authorization": "Bearer " + token, "Content-Type": "application/json"},
                  method="GET" if payload is None else "POST",
              )
              try:
                  with urllib.request.urlopen(request, timeout=40) as response:
                      body = response.read()
                      return json.loads(body) if body else None
              except urllib.error.HTTPError as error:
                  # API bodies can carry configuration. Never echo them.
                  raise SystemExit(f"Staging API {path}: HTTP {error.code}; inspect the named operation.")

          def snapshot():
              return api("/database/query", {"read_only": True, "query": """
                  select
                    (select count(*) from public.intelligence_workflows
                     where state not in ('completed','partial','failed','cancelled')) as unfinished,
                    (select count(*) from public.workflow_continuations
                     where state in ('due','held')) as queued,
                    (select count(*) from public.agent_attempts) as attempts,
                    (select count(*) from public.workflow_cost_budgets) as budgets,
                    (select count(*) from public.attempt_cost_reservations) as reservations,
                    exists(select 1 from public.core_v2_runner_settings
                      where armed and endpoint =
                        'https://viuqggxrahckzbrnecoo.supabase.co/functions/v1/core-v2-runner-tick') as armed,
                    exists(select 1 from cron.job where active and
                      (command like '%core_v2_tick_due_continuations%'
                       or command like '%core_v2_watchdog_tick%')) as watchdog
              """})[0]

          before = snapshot()
          if int(before["unfinished"]) or int(before["queued"]):
              raise SystemExit("Existing unfinished staging work must be reviewed before enabling; no old run was restarted.")
          if before["armed"] is not True or before["watchdog"] is not True:
              raise SystemExit("Staging continuation watchdog is not ready; nothing changed.")

          secrets = {item["name"]: item.get("value") for item in api("/secrets")}
          required = ("ANTHROPIC_API_KEY", "OPENAI_API_KEY", "GEMINI_API_KEY")
          missing = [name for name in required if not secrets.get(name)]
          if missing:
              raise SystemExit("Staging provider configuration missing: " + ", ".join(missing))
          functions = api("/functions")
          active = {item["slug"] for item in functions if item.get("status") == "ACTIVE"}
          if not {"core-v2-analysis", "core-v2-runner", "core-v2-runner-tick"}.issubset(active):
              raise SystemExit("The three staging analysis functions must be active; nothing changed.")
          hashes = {item["slug"]: item.get("ezbr_sha256") for item in functions}

          # Owner analyses already derive permission and budget from the saved
          # Run press. Leave the global paid-call gate and global budget alone.
          api("/secrets", [{"name": flag, "value": "true"}])
          after_secrets = {item["name"]: item.get("value") for item in api("/secrets")}
          if after_secrets.get(flag) not in ("true", hashlib.sha256(b"true").hexdigest()):
              raise SystemExit("Configuration write returned, but its readback did not verify; no analysis invoked.")
          if any(after_secrets.get(name) != value for name, value in secrets.items() if name != flag):
              raise SystemExit("Another setting changed during configuration; inspect staging before running.")
          after_hashes = {item["slug"]: item.get("ezbr_sha256") for item in api("/functions")}
          if hashes != after_hashes:
              raise SystemExit("Function code changed concurrently; inspect the deployment before running.")
          after = snapshot()
          if any(after[name] != before[name] for name in ("attempts", "budgets", "reservations")):
              raise SystemExit("Work appeared concurrently; review the staging record before declaring it idle.")

          report = (
              "Staging " + project + ": provider network enabled and read back.\n"
              "All three provider configurations present; function code unchanged.\n"
              "Watchdog active; no unfinished workflow or queued continuation at enablement.\n"
              "No analysis started, no function invoked, no new attempt or reservation.\n"
              "The next analysis requires the owner's Run press and its own recorded budget.\n"
              "Production was not addressed.\n"
          )
          print(report)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(report)
